# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
# 47.4 is the first build with the ResourceLocation.fromNamespaceAndPath backport Camafy uses.
forge_version_range=[47.4,)
loader_version_range=[47,)
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1


## Mod Properties

mod_id=unleashedlead
mod_name=Unleashed Lead
# GPL-3.0 to match Camafy. Easy to change: this line, LICENSE.txt and the README's licence section.
mod_license=GPL-3.0
mod_version=1.0.0
mod_group_id=net.camacraft.unleashedlead
mod_authors=Camawama
mod_description=Bedrock-style leads for Java: a simulated rope that sags, swings and drapes over blocks, elastic leash physics with a 12-block snap, and the 1.21 to 1.21.6 lead changes backported (leashed boats and rafts, mob-to-mob leads, shears that snip leads, the string lead recipe and more).


## Dependencies

# Camafy, the shared library mod (from mavenLocal): built and tested against the latest. 0.1.7 is
# the oldest it runs on: ropes and the lead pull read the local gravity (Gravity.ambientStrength,
# zero in space), besides compat.scale.EntityScale (0.1.6) and the 0.1.1 contracts (ShipForces
# physics hooks, MatchPolicies, PhysicsOwnership).
camafy_version=0.1.7
# The Camafy versions this mod accepts at runtime.
camafy_version_range=[0.1.7,0.2)

# Vanilla Backport (ItsBlackGear) and its Platform library, only for dev runs with -PvanillaBackport.
# Modrinth version ids: Vanilla Backport 1.1.7.10 for Forge 1.20.1, and Platform 1.3.4 (the only
# Forge 1.20.1 Platform inside its [1.3.4,) range). Vanilla Backport jar-in-jars MixinExtras 0.4.1,
# which a dev run doesn't unpack, so that goes on the dev runtime too.
vanilla_backport_modrinth_version=u8YPiN39
platform_modrinth_version=aWxR0Ksa
mixinextras_version=0.4.1

# Valkyrien Skies, only for the opt-in ship tests (-PshipTests): the same pins as Camafy's build.
# Modrinth version id of Valkyrien Skies 1.20.1-forge-2.4.11 (the same jar as VS's maven, with a
# dependency-free POM), the VS core API it was built against, and Kotlin for Forge 4.11.0.
vs_modrinth_version=pOkdwuUh
vs_core_version=1.1.0+cf208d8b56
kotlin_for_forge_modrinth_version=hmeyC41q

# Pehkui, only for the opt-in scaled-entity tests (-Ppehkui): Modrinth version id of Pehkui
# 3.8.2+1.20.1-forge, the same jar Genesis 0.7.3 nests. It jar-in-jars MixinExtras 0.3.6; the
# 0.4.1 above is already on the dev runtime.
pehkui_modrinth_version=SQpqSgAE
# Ad Astra, only for the opt-in zero-gravity smoke test (-PadAstra): Modrinth version ids of the jars
# in the user's pack (ad_astra-forge-1.20.1-1.15.21, botarium 2.3.4, resourcefullib 2.1.29,
# resourcefulconfig 2.1.3).
ad_astra_modrinth_version=8EwzHQkx
botarium_modrinth_version=O7D6FTfW
resourcefullib_modrinth_version=OhsHaCcW
resourcefulconfig_modrinth_version=DERs8u7v
