modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="camafy"
    mandatory=true
    versionRange="${camafy_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional: when Vanilla Backport is installed it owns the leash data model (its Leashable
# interface, boat leashing, the happy ghast) and Unleashed Lead layers its rope rendering and
# rope physics on top. Loading after it keeps our event handlers behind its registrations.
[[dependencies.${mod_id}]]
    modId="vanillabackport"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
