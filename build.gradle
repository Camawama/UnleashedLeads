plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Bundle MixinExtras inside the release jar (Forge 1.20.1 does not ship it).
jarJar.enable()

// SHIP TESTS ARE OPT-IN: gradlew runGameTestServer -PshipTests [-PvsBackend=classic|physx|jolt]
// (Full Stop's setup). The flag puts Valkyrien Skies and Kotlin for Forge on the dev runtime and
// compiles src/gametest, whose tests assemble real ships with VS's own ShipAssembler: the one place
// Unleashed Lead names VS types, so the release jar never carries them and never needs VS. Each
// fresh test world is seeded with the physics backend asked for (PhysX unless told otherwise).
def shipTests = project.hasProperty('shipTests')
if (shipTests) {
    sourceSets.main.java.srcDir 'src/gametest/java'
}

// PEHKUI TESTS ARE OPT-IN TOO: gradlew runGameTestServer -Ppehkui. The flag puts Pehkui (the size
// mod Genesis bundles) on the dev runtime and compiles src/pehkuiTest, whose tests resize mobs
// through Pehkui's own API. Like the ship tests, the release jar never carries them: the mod
// itself only reads Pehkui's motion scale through Camafy (compat.scale.EntityScale).
def pehkuiTests = project.hasProperty('pehkui')
if (pehkuiTests) {
    sourceSets.main.java.srcDir 'src/pehkuiTest/java'
}

// AD ASTRA SMOKE TEST, OPT-IN: gradlew runGameTestServer -PadAstra. The flag puts Ad Astra (and
// the three libraries it needs) on the dev runtime and compiles src/adAstraTest, which checks that
// Camafy's gravity reads its orbits as weightless and its Moon at a sixth, in the real dimensions.
// Nothing here compiles against Ad Astra: Camafy reaches it by reflection.
def adAstraTests = project.hasProperty('adAstra')
if (adAstraTests) {
    sourceSets.main.java.srcDir 'src/adAstraTest/java'
}
def shipTestBackend = {
    def backend = (project.findProperty('vsBackend') ?: 'physx').toString().toLowerCase(Locale.ROOT)
    if (!(backend in ['classic', 'physx', 'jolt'])) {
        throw new GradleException("-PvsBackend must be classic, physx or jolt, not '${backend}'")
    }
    return backend
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin needs the refmap remapped into SRG at dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Its own directory, so automated runs never rotate the logs or delete the world
            // of a manual runServer session.
            workingDirectory project.file('run-gametest')
            if (shipTests) {
                // the backend the ship tests report (see gameTestServerProperties)
                property 'unleashedlead.test.vsBackend', shipTestBackend()
            }
            if (pehkuiTests) {
                // Pehkui's compat1204minus.ScreenHandlerMixin (container reach) can't apply to
                // ForgeGradle's recompiled Minecraft: javac orders a lambda's captured variables
                // differently from Mojang's jar, and Pehkui's mixin config is required, so the
                // server would stop at startup. It applies in a real game. Only this run turns
                // mixin apply errors into warnings (check the log for any of ours).
                property 'mixin.env.ignoreRequired', 'true'
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Camafy, the shared library, is published to the local Maven repository.
    mavenLocal {
        content { includeGroup 'net.camacraft.camafy' }
    }
    // Only for the opt-in -PvanillaBackport dev runs.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Only for the opt-in -PshipTests runs: VS's core API. The VS mod jar and Kotlin for Forge come
    // from Modrinth's maven above, whose POMs carry no dependencies (as in Camafy's build).
    maven {
        name = 'ValkyrienSkies'
        url = 'https://maven.valkyrienskies.org'
        content { includeGroupByRegex 'org\\.valkyrienskies.*' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("net.camacraft.camafy:camafy:${camafy_version}")

    // MixinExtras: @WrapOperation in client/MobRendererMixin. The common jar's annotation
    // processor writes the refmap entries for it; the forge jar ships nested in the release jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    // Vanilla Backport (and the Platform library it needs) in dev runs, opt-in with
    // -PvanillaBackport. Unleashed Lead never compiles against it: it detects the mod at
    // runtime and talks to it by reflection (compat/VanillaBackport.java), so this only puts the
    // real thing behind the compatibility gametests.
    if (project.hasProperty('vanillaBackport')) {
        runtimeOnly fg.deobf("maven.modrinth:vanillabackport:${vanilla_backport_modrinth_version}")
        runtimeOnly fg.deobf("maven.modrinth:platform:${platform_modrinth_version}")
    }

    // Valkyrien Skies, only with -PshipTests. The mod reaches ships through Camafy and never
    // compiles against VS; only the ship tests in src/gametest do, to build and watch real ships.
    if (shipTests) {
        compileOnly fg.deobf("maven.modrinth:valkyrien-skies:${vs_modrinth_version}") { transitive = false }
        compileOnly("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:valkyrien-skies:${vs_modrinth_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:kotlin-for-forge:${kotlin_for_forge_modrinth_version}") { transitive = false }
    }

    // Ad Astra and its libraries, only with -PadAstra (see src/adAstraTest).
    if (adAstraTests) {
        runtimeOnly fg.deobf("maven.modrinth:ad-astra:${ad_astra_modrinth_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:botarium:${botarium_modrinth_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:resourceful-lib:${resourcefullib_modrinth_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:resourceful-config:${resourcefulconfig_modrinth_version}") { transitive = false }
    }

    // Pehkui, only with -Ppehkui: on the dev runtime for the scaled-mob gametests, and compileOnly
    // for them (src/pehkuiTest) to resize mobs through its API.
    if (pehkuiTests) {
        compileOnly fg.deobf("maven.modrinth:pehkui:${pehkui_modrinth_version}") { transitive = false }
        runtimeOnly fg.deobf("maven.modrinth:pehkui:${pehkui_modrinth_version}") { transitive = false }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            camafy_version_range: camafy_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // The plain jar has no MixinExtras inside; the release jar is the jarJar one below.
    archiveClassifier = 'slim'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

// The release artifact: build/libs/unleashedlead-<version>.jar, the reobfuscated mod plus
// MixinExtras nested under META-INF/jarjar.
tasks.named('jarJar').configure {
    archiveClassifier = ''
    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixins.json"])
    }
    finalizedBy 'reobfJarJar'
}

/*
 * Every gametest run starts from a fresh, flat, fixed-seed, empty world (the same setup as MKW
 * Mobility's suite): a dedicated gametest server otherwise generates normal terrain on a random
 * seed, and gravel or sand hanging over a carved plot can fall into it.
 */
tasks.register('cleanGameTestWorld', Delete) {
    group = 'verification'
    description = 'Deletes the saved gametest world so each run starts clean.'
    delete file('run-gametest/world')
}

tasks.register('gameTestServerProperties') {
    group = 'verification'
    description = 'Forces the gametest world to be flat, fixed-seed and empty.'

    doLast {
        def file = file('run-gametest/server.properties')
        file.parentFile.mkdirs()

        def props = new Properties()
        if (file.exists()) {
            file.withInputStream { props.load(it) }
        }

        props.setProperty('level-type', 'minecraft:flat')
        props.setProperty('level-seed', '0')
        props.setProperty('generate-structures', 'false')
        props.setProperty('spawn-monsters', 'false')
        props.setProperty('spawn-animals', 'false')
        props.setProperty('spawn-npcs', 'false')

        file.withOutputStream {
            props.store(it, 'Written by gameTestServerProperties -- see build.gradle')
        }

        if (shipTests) {
            // The physics backend the fresh test world starts on (-PvsBackend, PhysX by default).
            def backend = [classic: 'KRUNCH_CLASSIC', physx: 'KRUNCH_PHYSX', jolt: 'KRUNCH_JOLT'][shipTestBackend()]
            def vsCore = project.file('run-gametest/defaultconfigs/valkyrienskies/vs-core-server.toml')
            vsCore.parentFile.mkdirs()
            vsCore.text = "[\"Krunch Konfig\"]\n    physicsBackend = \"${backend}\"\n"
            println "Ship tests on Valkyrien Skies' ${backend} backend"
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'cleanGameTestWorld'
    dependsOn 'gameTestServerProperties'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
